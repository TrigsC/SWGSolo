<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <meta name="description" content="Read-only AI economy telemetry with live PvE hunter positions.">
  <title>AI Economy Command</title>
  <link rel="stylesheet" href="/dashboard/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-sigil" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26">
            <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="16" cy="16" r="4.5" fill="currentColor"/>
            <path d="M16 3v6M16 23v6M3 16h6M23 16h6" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 7l4 4M25 7l-4 4M7 25l4-4M25 25l-4-4" stroke="currentColor" stroke-width="1"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>AI ECONOMY COMMAND</h1>
          <p>BUREAU OF ECONOMIC SURVEILLANCE &middot; CLEARANCE: SIMULATION-ONLY</p>
        </div>
      </div>
      <div class="topbar-status">
        <div class="clock-block">
          <span class="clock-label">CST</span>
          <span id="clock" class="clock">--:--:--</span>
        </div>
        <div class="link-block" id="link-block" title="Uplink status">
          <span id="link-dot" class="link-dot down"></span>
          <span id="link-text" class="link-text">NO UPLINK</span>
          <span id="data-age" class="data-age"></span>
        </div>
        <button id="token-toggle" class="token-toggle" type="button" aria-label="API token">KEY</button>
      </div>
      <form id="token-form" class="token-form hidden">
        <input id="token-input" type="password" autocomplete="current-password"
               placeholder="REST API bearer token" aria-label="REST API token">
        <button type="submit">AUTHORIZE</button>
      </form>
    </header>

    <nav class="nav" id="nav" aria-label="Sections"></nav>

    <main class="view" id="view">
      <div class="boot-screen">
        <div class="boot-frame">
          <p class="boot-line">ESTABLISHING UPLINK&hellip;</p>
          <p class="boot-sub">Awaiting first telemetry snapshot from the hive.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/dashboard/app.js"></script>
</body>
</html>
